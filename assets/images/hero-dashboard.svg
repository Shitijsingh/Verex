<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" fill="none" role="img" aria-label="Wemonde Enterprise Digital Engineering Control Center">
  <defs>
    <linearGradient id="hd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="hd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19223c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1628" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hd-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hd-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hd-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hd-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="2" y="2" width="756" height="516" rx="18" fill="url(#hd-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M2 20C2 10.0589 10.0589 2 20 2H740C749.941 2 758 10.0589 758 20V46H2V20Z" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Traffic Light Dots -->
  <circle cx="28" cy="24" r="5" fill="#ef4444"/>
  <circle cx="44" cy="24" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="24" r="5" fill="#10b981"/>
  
  <!-- Window Address Bar / Title -->
  <rect x="180" y="14" width="400" height="22" rx="6" fill="#0b1120" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="196" cy="25" r="3" fill="#10b981" filter="url(#hd-glow)"/>
  <text x="210" y="29" font-family="-apple-system, monospace" font-size="11" fill="#94a3b8">wemonde-mesh.enterprise.internal/telemetry</text>
  
  <!-- Live Status Pill -->
  <rect x="635" y="14" width="105" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8"/>
  <circle cx="647" cy="24" r="3.5" fill="#10b981"/>
  <text x="656" y="28" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">99.98% LIVE</text>

  <!-- Metric Card 1: Throughput -->
  <g transform="translate(24, 64)">
    <rect width="220" height="92" rx="12" fill="url(#hd-card)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">PEAK THROUGHPUT</text>
    <text x="18" y="62" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff">48,250</text>
    <text x="120" y="60" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">req/sec</text>
    <rect x="145" y="18" width="58" height="20" rx="10" fill="rgba(0,240,255,0.12)"/>
    <text x="153" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00f0ff">+34.8%</text>
  </g>

  <!-- Metric Card 2: Edge Latency -->
  <g transform="translate(268, 64)">
    <rect width="220" height="92" rx="12" fill="url(#hd-card)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">P99 GLOBAL LATENCY</text>
    <text x="18" y="62" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#00f0ff">11.4</text>
    <text x="76" y="60" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b">ms</text>
    <rect x="150" y="18" width="52" height="20" rx="10" fill="rgba(16,185,129,0.12)"/>
    <text x="158" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#10b981">-18ms</text>
  </g>

  <!-- Metric Card 3: AI Inference Core -->
  <g transform="translate(512, 64)">
    <rect width="224" height="92" rx="12" fill="url(#hd-card)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">AI INFERENCE LOAD</text>
    <text x="18" y="62" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#a855f7">1.82B</text>
    <text x="106" y="60" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">tok/day</text>
    <rect x="156" y="18" width="52" height="20" rx="10" fill="rgba(168,85,247,0.15)"/>
    <text x="164" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#c084fc">ACTIVE</text>
  </g>

  <!-- Main Chart Section -->
  <g transform="translate(24, 174)">
    <rect width="464" height="200" rx="12" fill="url(#hd-card)" stroke="rgba(255,255,255,0.08)"/>
    <!-- Chart Header -->
    <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Real-time Ingress &amp; Scalability Mesh</text>
    <text x="18" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Active pods: 142 replicas across 3 geographic availability zones</text>

    <!-- Grid lines -->
    <line x1="18" y1="70" x2="446" y2="70" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3"/>
    <line x1="18" y1="110" x2="446" y2="110" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3"/>
    <line x1="18" y1="150" x2="446" y2="150" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3"/>

    <!-- Chart Path Area -->
    <path d="M22 165 C 60 150, 90 120, 130 135 C 170 150, 210 90, 250 95 C 290 100, 330 65, 370 75 C 410 85, 430 55, 444 50 L444 180 L22 180 Z" fill="url(#hd-area)"/>

    <!-- Chart Line -->
    <path d="M22 165 C 60 150, 90 120, 130 135 C 170 150, 210 90, 250 95 C 290 100, 330 65, 370 75 C 410 85, 430 55, 444 50" stroke="url(#hd-cyan)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#hd-glow)"/>

    <!-- Data points -->
    <circle cx="250" cy="95" r="4.5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="370" cy="75" r="4.5" fill="#6366f1" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="444" cy="50" r="5" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Marker Tooltip -->
    <rect x="360" y="24" width="76" height="22" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="0.8"/>
    <text x="370" y="38" font-family="-apple-system, monospace" font-size="10" font-weight="700" fill="#00f0ff">48.2k RPS</text>
  </g>

  <!-- Right Side: Microservice Health Nodes -->
  <g transform="translate(506, 174)">
    <rect width="230" height="200" rx="12" fill="url(#hd-card)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Cluster Architecture</text>
    
    <!-- Node 1 -->
    <g transform="translate(16, 44)">
      <rect width="198" height="32" rx="6" fill="#0b101c" stroke="rgba(255,255,255,0.05)"/>
      <circle cx="14" cy="16" r="4" fill="#10b981"/>
      <text x="26" y="20" font-family="-apple-system, monospace" font-size="10.5" fill="#e2e8f0">api-edge-gateway</text>
      <text x="160" y="20" font-family="-apple-system, sans-serif" font-size="9" fill="#10b981">99.99%</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(16, 82)">
      <rect width="198" height="32" rx="6" fill="#0b101c" stroke="rgba(255,255,255,0.05)"/>
      <circle cx="14" cy="16" r="4" fill="#6366f1"/>
      <text x="26" y="20" font-family="-apple-system, monospace" font-size="10.5" fill="#e2e8f0">ai-llm-orchestrator</text>
      <text x="165" y="20" font-family="-apple-system, sans-serif" font-size="9" fill="#a855f7">14ms</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(16, 120)">
      <rect width="198" height="32" rx="6" fill="#0b101c" stroke="rgba(255,255,255,0.05)"/>
      <circle cx="14" cy="16" r="4" fill="#00f0ff"/>
      <text x="26" y="20" font-family="-apple-system, monospace" font-size="10.5" fill="#e2e8f0">k8s-event-stream</text>
      <text x="160" y="20" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">SYNCED</text>
    </g>

    <!-- Node 4 -->
    <g transform="translate(16, 158)">
      <rect width="198" height="32" rx="6" fill="#0b101c" stroke="rgba(255,255,255,0.05)"/>
      <circle cx="14" cy="16" r="4" fill="#10b981"/>
      <text x="26" y="20" font-family="-apple-system, monospace" font-size="10.5" fill="#e2e8f0">distributed-db-mesh</text>
      <text x="160" y="20" font-family="-apple-system, sans-serif" font-size="9" fill="#10b981">HEALTHY</text>
    </g>
  </g>

  <!-- Bottom Log Terminal & CI/CD Pipeline Status -->
  <g transform="translate(24, 390)">
    <rect width="712" height="106" rx="10" fill="#080c16" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Terminal Header -->
    <rect width="712" height="24" rx="10" fill="#111827"/>
    <text x="14" y="16" font-family="-apple-system, monospace" font-size="10" fill="#64748b">WEMONDE DEVOPS PIPELINE • ZERO-DOWNTIME CANARY</text>
    
    <!-- Log Lines -->
    <text x="14" y="44" font-family="-apple-system, monospace" font-size="11" fill="#10b981">[INFO 12:58:02]</text>
    <text x="110" y="44" font-family="-apple-system, monospace" font-size="11" fill="#cbd5e1">Canary traffic routed 100% to v4.8.2. Automated health checks passed (1,240/1,240).</text>

    <text x="14" y="64" font-family="-apple-system, monospace" font-size="11" fill="#00f0ff">[SCALE 12:58:19]</text>
    <text x="110" y="64" font-family="-apple-system, monospace" font-size="11" fill="#cbd5e1">HPA scaled worker group in ap-south-1: +18 pods in 1.4s. Mean latency steady at 11ms.</text>

    <text x="14" y="86" font-family="-apple-system, monospace" font-size="11" fill="#a855f7">[SECURITY]</text>
    <text x="110" y="86" font-family="-apple-system, monospace" font-size="11" fill="#94a3b8">Zero-Trust mTLS handshakes verified. ISO 27001 &amp; SOC2 Type II compliance controls active.</text>
  </g>
</svg>